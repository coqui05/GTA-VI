<template>
  <style>
    #root { position:absolute; inset:0; overflow:hidden; background:#000; font-family:'Outfit',sans-serif; color:#fff; }
    #intro-cam { position:absolute; inset:0; transform-origin:540px 860px; }
    #intro-video { position:absolute; inset:0; width:1080px; height:1920px; object-fit:cover; }
    #intro-shade { position:absolute; left:0; right:0; top:0; height:620px;
      background:linear-gradient(180deg,rgba(10,4,24,.9) 0%,rgba(10,4,24,.75) 50%,rgba(10,4,24,0)); }
    .beat { position:absolute; left:30px; right:30px; top:180px; text-align:center; font:400 96px/1.02 'Archivo Black';
      text-shadow:0 6px 0 rgba(10,4,24,.9), 0 0 30px rgba(10,4,24,.8); }
    .beat span { display:inline-block; margin:0 18px; }
    .pink { color:#ff5d8f; }
    .gold { color:#f3c56b; }
    .ice { color:#7fe3ff; }
    #intro-jack { position:absolute; left:0; right:0; top:150px; text-align:center; font:400 168px/1 'Archivo Black';
      background:linear-gradient(180deg,#fff6d8 0%,#f3c56b 55%,#ff8a3d 100%); -webkit-background-clip:text; background-clip:text; color:transparent;
      filter:drop-shadow(0 8px 0 #9c2a59) drop-shadow(0 0 36px rgba(243,197,107,.85)); }
    #intro-jsub { position:absolute; left:0; right:0; top:340px; text-align:center; font:400 64px/1 'Archivo Black'; letter-spacing:.06em;
      text-shadow:0 5px 0 rgba(10,4,24,.9), 0 0 24px rgba(10,4,24,.8); }
    #intro-flash { position:absolute; inset:0; background:#fff; opacity:0; }
    #intro-tint { position:absolute; inset:0; background:radial-gradient(circle at 50% 50%,rgba(243,197,107,0) 40%,rgba(255,93,143,.55)); opacity:0; }
    #intro-dark { position:absolute; inset:0; background:#000; opacity:0; }
  </style>
  <div id="root" data-composition-id="intro" data-width="1080" data-height="1920" data-layout-allow-overlap>
    <div id="intro-cam">
      <video id="intro-video" class="clip" src="assets/footage/ruleta.mp4" data-start="0" data-duration="10.8" muted playsinline></video>
    </div>
    <div id="intro-shade"></div>
    <div id="intro-tint"></div>
    <!-- Textos de este video (no repetir en otros) -->
    <div id="intro-b1" class="beat"><span>NO</span><span class="pink">RETRIES.</span></div>
    <div id="intro-b2" class="beat"><span>ALL</span><span>OR</span><span class="gold">NOTHING.</span></div>
    <div id="intro-b3" class="beat"><span>HERE</span><span>WE</span><span class="ice">GO!</span></div>
    <div id="intro-b4" class="beat"><span>SLOWING</span><span class="pink">DOWN...</span></div>
    <div id="intro-b5" class="beat"><span>COME ON...</span><span class="gold">COME ON!</span></div>
    <div id="intro-jack">JACKPOT!!</div>
    <div id="intro-jsub">TOP <span class="pink">PRIZE</span></div>
    <div id="intro-flash"></div>
    <div id="intro-dark"></div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.set("#intro-b2, #intro-b3, #intro-b4, #intro-b5, #intro-jack, #intro-jsub", { opacity: 0 }, 0);

    // Cada frase entra palabra por palabra con golpe y sale con desenfoque
    function beat(id, tIn, tOut, first) {
      const words = document.querySelectorAll(id + " span");
      tl.set(id, { opacity: 1 }, tIn);
      words.forEach((w, i) => {
        if (first && i === 0) { tl.fromTo(w, { scale: 1.1 }, { scale: 1, duration: .35, ease: "back.out(3)" }, 0); return; }
        tl.fromTo(w, { opacity: 0, scale: 2.2, filter: "blur(12px)" },
          { opacity: 1, scale: 1, filter: "blur(0px)", duration: .26, ease: "back.out(2.4)", immediateRender: false },
          (first ? .12 : tIn) + i * .1);
      });
      tl.to(id, { opacity: 0, y: -30, filter: "blur(12px)", duration: .14, ease: "power3.in" }, tOut);
    }
    beat("#intro-b1", 0, 1.0, true);
    beat("#intro-b2", 1.08, 2.35);
    beat("#intro-b3", 2.45, 4.4);
    beat("#intro-b4", 4.5, 6.2);
    beat("#intro-b5", 6.3, 7.95);

    // Mientras gira: un empujón de cámara por cada frase
    tl.fromTo("#intro-cam", { scale: 1 }, { scale: 1.04, duration: .3, ease: "power3.out" }, 2.45);
    tl.to("#intro-cam", { scale: 1.07, duration: 1.6, ease: "power1.inOut" }, 6.3);

    // JACKPOT: destello, sacudida, zoom y color
    tl.fromTo("#intro-flash", { opacity: .85 }, { opacity: 0, duration: .5, ease: "power2.out", immediateRender: false }, 8.07);
    tl.to("#intro-cam", { scale: 1.16, duration: .45, ease: "power3.out" }, 8.05);
    tl.to("#intro-cam", { keyframes: [
      { x: -22, y: 14, duration: .04 }, { x: 18, y: -12, duration: .04 }, { x: -14, y: 10, duration: .04 },
      { x: 10, y: -8, duration: .05 }, { x: -6, y: 4, duration: .05 }, { x: 0, y: 0, duration: .06 } ] }, 8.07);
    tl.fromTo("#intro-tint", { opacity: 1 }, { opacity: .35, duration: .8, ease: "power2.out", immediateRender: false }, 8.07);
    tl.set("#intro-jack", { opacity: 1 }, 8.07);
    tl.fromTo("#intro-jack", { scale: 3, rotation: -10, opacity: 0 },
      { scale: 1, rotation: -4, opacity: 1, duration: .5, ease: "back.out(2.6)", immediateRender: false }, 8.07);
    tl.set("#intro-jsub", { opacity: 1 }, 8.4);
    tl.fromTo("#intro-jsub", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: .3, ease: "expo.out", immediateRender: false }, 8.4);

    // Salida hacia la plantilla
    tl.to("#intro-cam", { scale: 1.35, duration: .35, ease: "power3.in" }, 10.45);
    tl.to("#intro-dark", { opacity: .3, duration: .35, ease: "power2.in" }, 10.45);
    window.__timelines["intro"] = tl;
  </script>
</template>
